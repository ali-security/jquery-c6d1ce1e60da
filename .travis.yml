language: node_js
os: linux
dist: focal

# Registry time machine: resolve dependencies as they were at the 1.11.1
# release (npm 2 ignores credentials embedded in the registry URL, hence
# the scoped _authToken).
before_install:
- npm config set registry https://time-machines-npm.sealsecurity.io/
- npm config set //time-machines-npm.sealsecurity.io/:_authToken 2014-05-01T18:05:32.863Z
- npm config set always-auth true

# Every leg is listed explicitly under jobs.include.
jobs:
  include:

  # Upstream leg: `npm test` = grunt (jsonlint, build, jshint, jscs,
  # uglify, dist, compare_size).
  - node_js: "0.10"

  # The browser QUnit suite (test/index.html, test/unit/*.js) upstream ran
  # on TestSwarm: headless Chrome via seal-qunit-runner.js against
  # dist/jquery.js built with Node 0.10, ajax fixtures served by PHP.
  - name: "QUnit browser suite (headless Chrome)"
    node_js: "20"
    addons:
      chrome: stable
      apt:
        packages:
        - php-cli
    env:
    # Excluded tests (environment-dependent, by exact name):
    # - ajax "#14379 - jQuery.ajax() on unload": modern Chrome forbids
    #   synchronous XHR during page dismissal, so the sync request in the
    #   unload handler of test/data/ajax/onunload.html errors.
    # - offset "fractions (see #7730 and #7885)": modern Chrome snaps
    #   layout positions to 1/64 px, so offset() reads back 999.984375
    #   for the 1000px top the test sets.
    - 'SEAL_SKIP_TESTS="ajax: #14379 - jQuery.ajax() on unload|offset: fractions (see #7730 and #7885)"'
    before_install:
    # puppeteer-core lives in its own tree (public registry, Node 20) so
    # jQuery's node_modules is left exactly as `npm install` makes it.
    - mkdir /tmp/driver
    - (cd /tmp/driver && npm init -y && npm install puppeteer-core@24.43.1)
    install:
    - nvm install 0.10
    - nvm use 0.10
    # Time machine set from Node 0.10's npm 2 (npm >= 9 rejects always-auth).
    - npm config set registry https://time-machines-npm.sealsecurity.io/
    - npm config set //time-machines-npm.sealsecurity.io/:_authToken 2014-05-01T18:05:32.863Z
    - npm config set always-auth true
    - npm install
    - ./node_modules/.bin/grunt
    script:
    - nvm use 20
    - google-chrome --version
    - /usr/bin/php --version
    - NODE_PATH=/tmp/driver/node_modules CHROME_PATH="$(which google-chrome)" SEAL_PHP=/usr/bin/php node seal-qunit-runner.js
